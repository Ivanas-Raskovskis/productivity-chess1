<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Productivity Chess</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
    }
    #board {
      width: 480px;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Productivity Chess</h1>
  <div id="board"></div>
  <div id="status">Baltųjų ėjimas</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    const game = new Chess();
    const statusEl = document.getElementById('status');

    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      // leidžiam kelti tik tos spalvos figūras, kurios dabar eina
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
    }

    function onDrop(source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      updateStatus();
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function updateStatus() {
      let status = '';
      const moveColor = game.turn() === 'w' ? 'Baltųjų' : 'Juodųjų';

      if (game.in_checkmate()) {
        status = 'Šachmatas! ' + moveColor + ' pralaimėjo.';
      } else if (game.in_draw()) {
        status = 'Lygiosios.';
      } else {
        status = moveColor + ' ėjimas';
        if (game.in_check()) {
          status += ' (Šachas!)';
        }
      }
      statusEl.textContent = status;
    }

    const config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };

    const board = Chessboard('board', config);
  </script>
</body>
</html>
