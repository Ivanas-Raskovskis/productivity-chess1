<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Productivity Chess</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Productivity Chess</h1>

  <div id="moves-counter">Available moves: 0</div>
  <div id="board"></div>
  <div id="status">Baltųjų ėjimas</div>

  <div id="tasks">
    <h2>📋 Today's Tasks</h2>
    <div id="task-list"></div>
    <div class="add-task">
      <input type="text" id="new-task-name" placeholder="Nauja užduotis...">
      <button onclick="addTask()">+ Pridėti</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
