<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Productivity Chess</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Productivity Chess</h1>

  <div id="moves-counter">Available moves: 0</div>
  <div id="board"></div>
  <div id="status">Baltųjų ėjimas</div>
  <button id="new-game-btn" onclick="confirmNewGame()">🔄 Nauja partija</button>

  <div id="tasks">
    <h2>📋 Today's Tasks</h2>
    <div id="task-list"></div>
    <div class="add-task">
      <input type="text" id="new-task-name" placeholder="Nauja užduotis...">
      <button onclick="addTask()">+ Pridėti</button>
    </div>
  </div>

  <div id="game-over-modal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="modal-title">Partija baigta</h2>
      <p id="modal-message"></p>
      <div class="modal-stats">
        <div><span id="stat-wins">0</span><small>Pergalės</small></div>
        <div><span id="stat-losses">0</span><small>Pralaimėjimai</small></div>
        <div><span id="stat-draws">0</span><small>Lygiosios</small></div>
      </div>
      <button onclick="startNewGame()">Nauja partija</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
