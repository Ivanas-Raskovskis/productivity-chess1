<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Productivity Chess</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
    }
    #board {
      width: 480px;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
    }
    #moves-counter {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #6fcf97;
    }
    #tasks {
      margin-top: 40px;
      width: 480px;
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
    }
    #tasks h2 {
      margin-top: 0;
    }
    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #3a3a3a;
    }
    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .task.done .task-name {
      text-decoration: line-through;
      color: #777;
    }
    .task-reward {
      color: #6fcf97;
      font-size: 14px;
    }
    .add-task {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }
    .add-task input {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      border: none;
    }
    .add-task button {
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      background: #6fcf97;
      cursor: pointer;
      font-weight: bold;
    }
    .task button.remove {
      background: none;
      border: none;
      color: #e57373;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Productivity Chess</h1>

  <div id="moves-counter">Available moves: 0</div>
  <div id="board"></div>
  <div id="status">Baltųjų ėjimas</div>

  <div id="tasks">
    <h2>📋 Today's Tasks</h2>
    <div id="task-list"></div>
    <div class="add-task">
      <input type="text" id="new-task-name" placeholder="Nauja užduotis...">
      <button onclick="addTask()">+ Pridėti</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    // ---------- ŠACHMATAI ----------
    const game = new Chess();
    const statusEl = document.getElementById('status');
    const movesCounterEl = document.getElementById('moves-counter');

    let availableMoves = parseInt(localStorage.getItem('availableMoves') || '0');

    function updateMovesDisplay() {
      movesCounterEl.textContent = 'Available moves: ' + availableMoves;
      localStorage.setItem('availableMoves', availableMoves);
    }

    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      if (availableMoves <= 0) {
        alert('Neturi likusių ėjimų! Atlik užduotį, kad gautum ėjimą.');
        return false;
      }
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
    }

    function onDrop(source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      availableMoves--;
      updateMovesDisplay();
      updateStatus();
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function updateStatus() {
      let status = '';
      const moveColor = game.turn() === 'w' ? 'Baltųjų' : 'Juodųjų';

      if (game.in_checkmate()) {
        status = 'Šachmatas! ' + moveColor + ' pralaimėjo.';
      } else if (game.in_draw()) {
        status = 'Lygiosios.';
      } else {
        status = moveColor + ' ėjimas';
        if (game.in_check()) {
          status += ' (Šachas!)';
        }
      }
      statusEl.textContent = status;
    }

    const config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };

    const board = Chessboard('board', config);
    updateMovesDisplay();

    // ---------- TASKS ----------
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

    if (tasks.length === 0) {
      tasks = [
        { id: 1, name: '30 min. mokymosi', reward: 1, done: false },
        { id: 2, name: 'Sportas', reward: 1, done: false },
        { id: 3, name: 'Projekto darbas', reward: 2, done: false }
      ];
    }

    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      const listEl = document.getElementById('task-list');
      listEl.innerHTML = '';

      tasks.forEach(task => {
        const taskEl = document.createElement('div');
        taskEl.className = 'task' + (task.done ? ' done' : '');

        taskEl.innerHTML = `
          <div class="task-left">
            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})">
            <span class="task-name">${task.name}</span>
          </div>
          <div class="task-left">
            <span class="task-reward">+${task.reward} move</span>
            <button class="remove" onclick="removeTask(${task.id})">✕</button>
          </div>
        `;

        listEl.appendChild(taskEl);
      });

      saveTasks();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      if (!task.done) {
        availableMoves += task.reward;
      } else {
        availableMoves -= task.reward;
      }

      task.done = !task.done;
      updateMovesDisplay();
      renderTasks();
    }

    function removeTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
    }

    function addTask() {
      const input = document.getElementById('new-task-name');
      const name = input.value.trim();
      if (!name) return;

      tasks.push({
        id: Date.now(),
        name: name,
        reward: 1,
        done: false
      });

      input.value = '';
      renderTasks();
    }

    renderTasks();
  </script>
</body>
</html>
